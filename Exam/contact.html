<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Bites - Contact & Reservations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Nova Bites</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="contact-container">
      <section class="contact-info">
        <h2>Contact Details</h2>
        <p><strong>Location:</strong> Along Ogoja Road, Abakaliki, Ebonyi State</p>
        <p><strong>Phone:</strong> +234 801 234 5678</p>
        <p><strong>Email:</strong> hello@novabites.ng</p>
        <p><strong>Hours:</strong> Monday to Sunday, 11:00 AM - 9:00 PM</p>
      </section>

      <section class="reservation-form">
        <h2>Make a Reservation / Order</h2>
        <form action="#" method="POST">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email address">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
          </div>
          <div class="form-group">
            <label for="date">Reservation Date</label>
            <input type="date" id="date" name="date" required>
          </div>
          <div class="form-group">
            <label for="notes">Special Requests / Order Notes</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Any special instructions or menu selections?"></textarea>
          </div>
          <button type="submit">Submit Reservation</button>
        </form>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Nova Bites. All rights reserved.</p>
  </footer>
</body>
</html>
